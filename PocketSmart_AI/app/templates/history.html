{% extends "base.html" %}

{% block title %}
History — PocketSmart AI
{% endblock %}


{% block content %}

<section class="page-head">

    <p class="eyebrow">
        RECOMMENDATION HISTORY
    </p>

    <h1>
        Your previous plans.
    </h1>

    <p>
        Saved recommendations are
        attached to your account.
    </p>

</section>


<section
    id="historyList"
    class="history-list"
>
    <p class="loading">
        Loading history...
    </p>
</section>

{% endblock %}


{% block scripts %}

<script>
document.addEventListener(
    "DOMContentLoaded",
    function () {
        if (typeof loadHistory === "function") {
            loadHistory();
        }
    }
);
</script>

{% endblock %}
