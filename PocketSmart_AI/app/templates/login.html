{% extends "base.html" %}

{% block title %}
Login — PocketSmart AI
{% endblock %}


{% block content %}

<section class="auth">

    <div class="auth-card">

        <p class="eyebrow">
            WELCOME BACK
        </p>

        <h1>
            Sign in
        </h1>

        <form id="loginForm">

            <label>
                Email

                <input
                    type="email"
                    name="email"
                    required
                >

            </label>


            <label>
                Password

                <input
                    type="password"
                    name="password"
                    required
                >

            </label>


            <button
                class="btn primary"
                type="submit"
            >
                Sign in
            </button>


            <p class="msg"></p>

        </form>


        <p>
            New here?

            <a href="/register">
                Create an account
            </a>
        </p>

    </div>

</section>

{% endblock %}


{% block scripts %}

<script>

setupAuthForm(
    "loginForm",
    "/api/login",
    "/dashboard"
);

</script>

{% endblock %}
