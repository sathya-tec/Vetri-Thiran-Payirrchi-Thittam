<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<header class="nav">

    <a
        class="brand"
        href="/"
    >
        PocketSmart <span>AI</span>
    </a>

    <nav>

        <a href="/planner/home">
            Home
        </a>

        <a href="/planner/party">
            Party
        </a>

        <a href="/planner/jewelry">
            Jewelry
        </a>

        <a href="/history">
            History
        </a>

        <a href="/testimonials">
            Testimonials
        </a>

        <a
            id="authLink"
            href="/login"
        >
            Login
        </a>

    </nav>

</header>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer>

    <strong>
        PocketSmart AI
    </strong>

    <span>
        Budget-aware recommendations
        for everyday planning.
    </span>

</footer>


<script src="/static/js/app.js"></script>

{% block scripts %}
{% endblock %}

</body>

</html>
