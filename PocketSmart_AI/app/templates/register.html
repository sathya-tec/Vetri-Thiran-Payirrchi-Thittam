{% extends "base.html" %}

{% block title %}
Register — PocketSmart AI
{% endblock %}


{% block content %}

<section class="auth">

    <div class="auth-card">

        <p class="eyebrow">
            POCKETSMART AI
        </p>

        <h1>
            Create account
        </h1>


        <form id="registerForm">

            <label>

                Name

                <input
                    name="name"
                    required
                    minlength="2"
                >

            </label>


            <label>

                Email

                <input
                    type="email"
                    name="email"
                    required
                >

            </label>


            <label>

                Password

                <input
                    type="password"
                    name="password"
                    minlength="8"
                    required
                >

            </label>


            <button
                class="btn primary"
                type="submit"
            >
                Create account
            </button>


            <p class="msg"></p>

        </form>


        <p>

            Already registered?

            <a href="/login">
                Sign in
            </a>

        </p>

    </div>

</section>

{% endblock %}


{% block scripts %}

<script>

setupRegister();

</script>

{% endblock %}
